name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# NOTE : les jobs Linux tournent sur ubuntu-22.04 et NON sur ubuntu-latest.
# Un executable PyInstaller exige au moins la glibc de sa machine de build ;
# compile sur 24.04 il reclame la 2.38 et refuse de demarrer sur Ubuntu 22.04,
# Debian 12 ou RHEL 9 — une bonne part du parc. 22.04 abaisse le plancher a
# 2.35 sans rien couter. (`runs-on` n'accepte pas de variable `env`, d'ou la
# valeur repetee dans chaque job.)

jobs:
  # Verifie que le code reste importable sous Linux : c'est la ou les regressions
  # de portabilite se voient en premier (dependance Windows-only reintroduite,
  # `os.startfile` non garde, backend PTY absent...). Volontairement sans Qt :
  # le but est de valider la couche `core`, pas de rendre une fenetre.
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q taskpilot tools main.py mcp_main.py

      - name: Import the platform layer
        run: |
          python - <<'PY'
          from taskpilot.core import editors, logs, processes, scripts, system
          from taskpilot.core import pty_backend, task_runner, vscode_tasks
          assert not system.IS_WIN and system.IS_LINUX
          assert pty_backend.HAVE_PTY, pty_backend.PTY_IMPORT_ERROR
          assert system.shell_argv("echo hi")[0] == "/bin/sh"
          assert system.default_shells(), "aucun shell detecte"
          assert processes._all_processes(), "inventaire des process vide"
          print("OK :", len(processes._all_processes()), "process,",
                len(system.default_shells()), "shells")
          PY

  # Deux familles de builds volontairement isolees : l'app Qt et le serveur MCP
  # n'ont aucune dependance commune (PySide6/PTY d'un cote, le SDK `mcp` de
  # l'autre). Les melanger gonflerait les deux executables.
  build-app-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install setuptools "pyinstaller>=6.11" -r requirements.txt

      - name: Build TaskPilot.exe
        run: python -m PyInstaller --noconfirm taskpilot.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPilot-windows
          path: dist/TaskPilot.exe

  build-app-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ces bibliotheques ne sont PAS dans la roue PySide6 : sans elles
      # installees ici, PyInstaller ne les embarque pas et le binaire produit
      # ne demarre sur aucun bureau X11. Cf. packaging/linux-deps.txt.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb \
            $(grep -v '^\s*#' packaging/linux-deps.txt | grep -v '^\s*$')

      - name: Install dependencies
        run: python -m pip install setuptools "pyinstaller>=6.11" -r requirements.txt

      - name: Build TaskPilot (single file)
        run: python -m PyInstaller --noconfirm taskpilot.spec

      - name: Build the AppImage
        run: ./packaging/build-appimage.sh

      # Garde-fou : c'est exactement ce qui manquait au premier build Linux.
      # Le plugin xcb se charge en dlopen, donc une dependance absente ne se
      # voit ni a la compilation ni au demarrage en mode offscreen — seulement
      # sur le bureau de l'utilisateur.
      - name: Check the xcb plugin has no missing library
        run: |
          plugin=$(find dist/onedir -name libqxcb.so | head -1)
          echo "plugin : $plugin"
          if ldd "$plugin" | grep "not found"; then
            echo "ECHEC : bibliotheques manquantes dans le bundle (cf. packaging/linux-deps.txt)"
            exit 1
          fi
          echo "OK : aucune dependance manquante"

      # Un binaire Qt peut se construire parfaitement et mourir a l'init de la
      # plateforme. On le lance donc pour de vrai sur un serveur X (Xvfb) : s'il
      # tient 15 s, la fenetre s'est ouverte.
      - name: Smoke test (real X11 startup)
        run: |
          for target in dist/TaskPilot dist/TaskPilot-x86_64.AppImage; do
            echo "--- $target"
            chmod +x "$target"
            xvfb-run -a "$target" > /tmp/app.log 2>&1 &
            pid=$!
            sleep 15
            if kill -0 $pid 2>/dev/null; then
              echo "OK : toujours vivant apres 15 s"
              kill $pid 2>/dev/null || true
              wait $pid 2>/dev/null || true
            else
              echo "ECHEC : l'application s'est arretee"
              cat /tmp/app.log
              exit 1
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaskPilot-linux
          path: |
            dist/TaskPilot
            dist/TaskPilot-x86_64.AppImage

  build-mcp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TaskPilotMcp-windows
            binary: dist/TaskPilotMcp.exe
          # Meme contrainte de glibc que l'application (cf. la note en tete).
          - os: ubuntu-22.04
            artifact: TaskPilotMcp-linux
            binary: dist/TaskPilotMcp
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install setuptools "pyinstaller>=6.11" -r requirements-mcp.txt

      - name: Build TaskPilotMcp
        run: python -m PyInstaller --noconfirm taskpilot-mcp.spec

      # Le transport MCP est stdio : un exe qui demarre mais ne repond pas au
      # handshake passerait le build sans que rien ne le signale. On verifie
      # donc initialize + tools/list avant de publier.
      - name: Smoke test (MCP handshake)
        run: python tools/smoke_mcp.py ${{ matrix.binary }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    needs: [portability, build-app-windows, build-app-linux, build-mcp]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Les binaires Linux et Windows portent le meme nom dans leurs artefacts
      # respectifs : on les renomme avant publication pour qu'ils cohabitent
      # dans une seule release.
      - name: Stage release files
        run: |
          mkdir -p release
          cp artifacts/TaskPilot-windows/TaskPilot.exe        release/TaskPilot.exe
          cp artifacts/TaskPilotMcp-windows/TaskPilotMcp.exe  release/TaskPilotMcp.exe
          cp artifacts/TaskPilot-linux/TaskPilot-x86_64.AppImage release/TaskPilot-x86_64.AppImage
          cp artifacts/TaskPilot-linux/TaskPilot              release/TaskPilot-linux-x86_64
          cp artifacts/TaskPilotMcp-linux/TaskPilotMcp        release/TaskPilotMcp-linux-x86_64
          chmod +x release/TaskPilot-x86_64.AppImage \
                   release/TaskPilot-linux-x86_64 \
                   release/TaskPilotMcp-linux-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TaskPilot v1.0.${{ github.run_number }}
          body: |
            Build automatique depuis `${{ github.sha }}`.

            **Windows**
            - **`TaskPilot.exe`** — l'application (autonome, aucune installation requise).
            - **`TaskPilotMcp.exe`** — le serveur MCP des logs seul.

            **Linux** (x86_64, glibc ≥ 2.35 : Ubuntu 22.04+, Debian 12+, Fedora 36+, RHEL 9+)
            - **`TaskPilot-x86_64.AppImage`** — *le téléchargement recommandé*.
              `chmod +x` puis lancer ; porte son entrée de menu et son icône.
            - **`TaskPilot-linux-x86_64`** — le même binaire nu, sans intégration
              au bureau (`packaging/install-desktop.sh` l'ajoute au menu).
            - **`TaskPilotMcp-linux-x86_64`** — le serveur MCP des logs seul.

            Les bibliothèques Qt/xcb sont embarquées : aucun paquet à installer.

            Les serveurs MCP sont à déclarer dans votre client (Zed, Claude
            Code…). Autonomes : ni Python ni SDK `mcp` à installer, ni
            `PYTHONPATH` à configurer.
          files: release/*
