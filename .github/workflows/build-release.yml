name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Deux builds volontairement isoles : l'app Qt et le serveur MCP n'ont aucune
  # dependance commune (PySide6/pywinpty d'un cote, le SDK `mcp` de l'autre).
  # Les melanger dans un seul environnement gonflerait les deux executables.
  build-app:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install setuptools "pyinstaller>=6.11" -r requirements.txt

      - name: Build TaskPilot.exe
        run: python -m PyInstaller --noconfirm taskpilot.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPilot
          path: dist/TaskPilot.exe

  build-mcp:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install setuptools "pyinstaller>=6.11" -r requirements-mcp.txt

      - name: Build TaskPilotMcp.exe
        run: python -m PyInstaller --noconfirm taskpilot-mcp.spec

      # Le transport MCP est stdio : un exe qui demarre mais ne repond pas au
      # handshake passerait le build sans que rien ne le signale. On verifie
      # donc initialize + tools/list avant de publier.
      - name: Smoke test (MCP handshake)
        run: python tools/smoke_mcp.py dist/TaskPilotMcp.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPilotMcp
          path: dist/TaskPilotMcp.exe

  release:
    needs: [build-app, build-mcp]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TaskPilot v1.0.${{ github.run_number }}
          body: |
            Build automatique depuis `${{ github.sha }}`.

            - **`TaskPilot.exe`** — l'application (autonome, aucune installation requise).
            - **`TaskPilotMcp.exe`** — le serveur MCP des logs seul, à déclarer
              dans votre client (Zed, Claude Code…). Autonome lui aussi : ni
              Python ni SDK `mcp` à installer, ni `PYTHONPATH` à configurer.
          files: |
            artifacts/TaskPilot/TaskPilot.exe
            artifacts/TaskPilotMcp/TaskPilotMcp.exe
